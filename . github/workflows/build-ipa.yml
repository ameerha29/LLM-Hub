name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Find Xcode project or workspace
        id: find_proj
        run: |
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "project=$PROJECT" >> $GITHUB_OUTPUT

      - name: Build archive (Unsigned)
        run: |
          if [ -n "${{ steps.find_proj.outputs.workspace }}" ]; then
            SCHEME=$(xcodebuild -list -workspace "${{ steps.find_proj.outputs.workspace }}" -json | python3 -c "import sys, json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
            xcodebuild archive \
              -workspace "${{ steps.find_proj.outputs.workspace }}" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            SCHEME=$(xcodebuild -list -project "${{ steps.find_proj.outputs.project }}" -json | python3 -c "import sys, json; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
            xcodebuild archive \
              -project "${{ steps.find_proj.outputs.project }}" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package into IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$RUNNER_TEMP/ipa_build/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa_build/Payload/"
          cd "$RUNNER_TEMP/ipa_build"
          zip -qry "$RUNNER_TEMP/UnsignedApp.ipa" Payload
          mkdir -p "$GITHUB_WORKSPACE/build_output"
          cp "$RUNNER_TEMP/UnsignedApp.ipa" "$GITHUB_WORKSPACE/build_output/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-IPA
          path: build_output/UnsignedApp.ipa
        # run
